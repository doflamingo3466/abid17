<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Expense Tracker</h1>

      <div class="card">
        <form id="form">
          <input
            id="title"
            placeholder="Name"
            oninput="this.value = this.value.replace(/[^a-zA-Z ]/g, '')"
            required
          />
          <input
            id="amount"
            type="number"
            min="0.1"
            step="0.001"
            placeholder="Amount"
            required
          />
          <select id="category">
            <option>Food</option>
            <option>Transport</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Health</option>
            <option>Other</option>
          </select>
          
          <input id="date" type="date" required />
          <button>Add</button>
        </form>

        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Date</th>
                <th class="right">Amount</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="list"></tbody>
          </table>
        </div>

        <p id="total"></p>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
